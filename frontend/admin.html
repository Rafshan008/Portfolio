<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Rafshan Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css?v=2">
</head>
<body>

<!-- Login Screen -->
<div id="login-screen" class="screen active">
  <div class="login-card">
    <h2>Admin Access</h2>
    <p>Please log in to edit site content.</p>
    <form id="login-form">
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit" class="btn solid">Login</button>
    </form>
    <p id="login-error" class="error-msg"></p>
  </div>
</div>

<!-- Dashboard Screen -->
<div id="dashboard-screen" class="screen">
  <aside class="sidebar">
    <div class="brand">
      <span class="px"></span> ADMIN
    </div>
    <ul class="nav-links" id="admin-nav">
      <li><a href="#" data-section="meta" class="active">Meta & SEO</a></li>
      <li><a href="#" data-section="hero">Hero Section</a></li>
      <li><a href="#" data-section="profile">Profile</a></li>
      <li><a href="#" data-section="experience">Experience</a></li>
      <li><a href="#" data-section="projects">Projects</a></li>
      <li><a href="#" data-section="skills">Skills</a></li>
      <li><a href="#" data-section="photography">Photography</a></li>
      <li><a href="#" data-section="media">Media & Embeds</a></li>
      <li><a href="#" data-section="custom">Custom Sections</a></li>
      <li><a href="#" data-section="contact">Contact</a></li>
      <li><a href="#" data-section="footer">Footer</a></li>
      <li><a href="#" data-section="settings">Settings</a></li>
    </ul>
    <div class="sidebar-footer">
      <a href="/" target="_blank" class="btn ghost">Live Preview</a>
      <button id="logout-btn" class="btn ghost">Logout</button>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <h2 id="current-section-title">Meta & SEO</h2>
      <div class="actions">
        <button id="export-json" class="btn ghost">Export Data</button>
        <button id="save-all" class="btn solid">Save Changes</button>
      </div>
    </header>

    <div class="editor-container" id="editor-container">
      <!-- Dynamic forms will be injected here by admin.js -->
    </div>
  </main>
</div>

<!-- Toast Notification -->
<div id="toast" class="toast">Saved successfully!</div>

<script src="js/admin.js?v=6"></script>
</body>
</html>
